<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Suzuki Alto VXL automatic hatchback illustration">
  <defs>
    <linearGradient id="body2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#dde2ea"/>
      <stop offset="100%" stop-color="#a8b0bf"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a5069"/>
      <stop offset="55%" stop-color="#1a283a"/>
      <stop offset="100%" stop-color="#0d1621"/>
    </linearGradient>
    <linearGradient id="tire2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3240"/>
      <stop offset="100%" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="rim2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6fa"/>
      <stop offset="100%" stop-color="#98a2b3"/>
    </linearGradient>
    <radialGradient id="shadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3dc9c"/>
      <stop offset="100%" stop-color="#d99524"/>
    </linearGradient>
  </defs>

  <ellipse cx="450" cy="360" rx="300" ry="24" fill="url(#shadow2)"/>
  <ellipse cx="450" cy="356" rx="228" ry="8" fill="url(#gold2)" opacity="0.22"/>

  <!-- tall, boxy Kei-car hatchback body -->
  <path d="M96 306
           C80 306 70 296 68 282
           C66 262 76 252 104 246
           L156 236
           C182 212 206 176 232 152
           C252 134 276 126 306 126
           L556 126
           C588 126 610 138 626 158
           L672 216
           L790 232
           C826 237 844 248 844 274
           C844 292 834 306 818 306
           Z"
        fill="url(#body2)" stroke="#98a2b3" stroke-width="2"/>

  <path d="M110 306 L818 306 C834 306 844 292 844 274 L844 286 C844 296 834 308 818 308 L110 308 Z"
        fill="#78828f" opacity="0.5"/>

  <path d="M148 306 A74 74 0 0 1 296 306" fill="none" stroke="#8d97a8" stroke-width="4"/>
  <path d="M604 306 A74 74 0 0 1 752 306" fill="none" stroke="#8d97a8" stroke-width="4"/>

  <!-- greenhouse -->
  <path d="M248 168
           C262 150 282 140 308 140
           L400 140
           L400 212
           L214 212
           C222 194 234 179 248 168 Z"
        fill="url(#glass2)"/>
  <path d="M418 140 L556 140 C578 140 596 150 610 166 L648 208 L418 208 Z"
        fill="url(#glass2)"/>
  <rect x="400" y="136" width="18" height="76" fill="#d5dbe4"/>
  <path d="M262 166 L372 152 L372 172 L250 184 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M432 152 L544 156 L572 184 L432 184 Z" fill="#ffffff" opacity="0.12"/>

  <rect x="212" y="206" width="404" height="5" rx="2.5" fill="url(#gold2)" opacity="0.85"/>

  <line x1="400" y1="212" x2="400" y2="304" stroke="#a3adbd" stroke-width="2.5"/>
  <line x1="214" y1="212" x2="214" y2="304" stroke="#a3adbd" stroke-width="2.5"/>
  <rect x="242" y="232" width="38" height="8" rx="4" fill="#8e98a8"/>
  <rect x="428" y="232" width="38" height="8" rx="4" fill="#8e98a8"/>

  <path d="M212 202 L190 196 L186 210 L210 214 Z" fill="#c9d0db" stroke="#8d97a8" stroke-width="2"/>

  <!-- headlights (tall Kei-car style) -->
  <path d="M70 250 L128 238 L134 274 L72 282 Z" fill="#f6f9ff" stroke="#c3cbd8" stroke-width="2"/>
  <path d="M70 250 L128 238 L130 250 L71 260 Z" fill="#ffffff"/>
  <!-- tail lights -->
  <path d="M796 236 L844 244 L844 282 L796 274 Z" fill="#e5484d"/>
  <path d="M796 236 L840 244 L840 254 L796 246 Z" fill="#ff8f92"/>

  <rect x="70" y="288" width="46" height="14" rx="4" fill="#2b3240"/>
  <rect x="76" y="291" width="34" height="3" rx="1.5" fill="#6b7487"/>
  <rect x="76" y="297" width="34" height="3" rx="1.5" fill="#6b7487"/>

  <!-- wheels (smaller Kei-car size) -->
  <g>
    <circle cx="222" cy="306" r="58" fill="url(#tire2)"/>
    <circle cx="222" cy="306" r="34" fill="url(#rim2)"/>
    <circle cx="222" cy="306" r="26" fill="#e8ecf3"/>
    <g stroke="#8b95a6" stroke-width="5" stroke-linecap="round">
      <line x1="222" y1="282" x2="222" y2="330"/>
      <line x1="201" y1="293" x2="243" y2="319"/>
      <line x1="201" y1="319" x2="243" y2="293"/>
    </g>
    <circle cx="222" cy="306" r="9" fill="#c9d0db"/>
    <circle cx="222" cy="306" r="58" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <g>
    <circle cx="678" cy="306" r="58" fill="url(#tire2)"/>
    <circle cx="678" cy="306" r="34" fill="url(#rim2)"/>
    <circle cx="678" cy="306" r="26" fill="#e8ecf3"/>
    <g stroke="#8b95a6" stroke-width="5" stroke-linecap="round">
      <line x1="678" y1="282" x2="678" y2="330"/>
      <line x1="657" y1="293" x2="699" y2="319"/>
      <line x1="657" y1="319" x2="699" y2="293"/>
    </g>
    <circle cx="678" cy="306" r="9" fill="#c9d0db"/>
    <circle cx="678" cy="306" r="58" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
