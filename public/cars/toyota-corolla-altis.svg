<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Toyota Corolla Altis automatic sedan illustration">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e9ecf2"/>
      <stop offset="100%" stop-color="#b9c0cd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f5670"/>
      <stop offset="55%" stop-color="#1c2b3d"/>
      <stop offset="100%" stop-color="#0e1723"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3240"/>
      <stop offset="100%" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6fa"/>
      <stop offset="100%" stop-color="#98a2b3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3dc9c"/>
      <stop offset="100%" stop-color="#d99524"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="450" cy="356" rx="330" ry="26" fill="url(#shadow)"/>
  <!-- gold floor reflection -->
  <ellipse cx="450" cy="352" rx="250" ry="8" fill="url(#gold)" opacity="0.22"/>

  <!-- body -->
  <path d="M72 300
           C58 300 50 288 50 272
           C50 250 62 240 96 234
           L214 218
           C252 212 286 194 322 166
           C344 149 368 141 400 140
           L530 140
           C562 140 586 149 606 166
           L672 224
           L792 238
           C832 243 852 254 852 278
           C852 292 844 300 830 300
           Z"
        fill="url(#body)" stroke="#9aa4b6" stroke-width="2"/>

  <!-- lower skirt shading -->
  <path d="M96 300 L830 300 C844 300 852 292 852 278 L852 286 C852 296 844 302 830 302 L96 302 Z" fill="#7d8798" opacity="0.5"/>

  <!-- wheel arches -->
  <path d="M132 300 A78 78 0 0 1 288 300" fill="none" stroke="#8d97a8" stroke-width="4"/>
  <path d="M612 300 A78 78 0 0 1 768 300" fill="none" stroke="#8d97a8" stroke-width="4"/>

  <!-- greenhouse / glass -->
  <path d="M340 168
           C356 155 374 150 402 150
           L470 150
           L470 206
           L300 206
           C312 190 326 177 340 168 Z"
        fill="url(#glass)"/>
  <path d="M488 150 L528 150 C552 150 570 157 584 170 L616 202 L488 202 Z"
        fill="url(#glass)"/>
  <!-- roof pillar -->
  <rect x="470" y="146" width="18" height="62" fill="#dfe4ec"/>
  <!-- glass highlights -->
  <path d="M352 172 L436 162 L436 178 L336 186 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M500 162 L556 166 L580 186 L500 186 Z" fill="#ffffff" opacity="0.12"/>

  <!-- beltline chrome -->
  <rect x="292" y="200" width="340" height="5" rx="2.5" fill="url(#gold)" opacity="0.85"/>

  <!-- door lines & handles -->
  <line x1="470" y1="206" x2="470" y2="298" stroke="#a3adbd" stroke-width="2.5"/>
  <line x1="300" y1="206" x2="300" y2="298" stroke="#a3adbd" stroke-width="2.5"/>
  <rect x="330" y="224" width="42" height="8" rx="4" fill="#8e98a8"/>
  <rect x="498" y="224" width="42" height="8" rx="4" fill="#8e98a8"/>

  <!-- side mirror -->
  <path d="M296 196 L272 190 L268 204 L294 208 Z" fill="#c9d0db" stroke="#8d97a8" stroke-width="2"/>

  <!-- headlight -->
  <path d="M56 258 L118 246 L124 268 L58 274 Z" fill="#f6f9ff" stroke="#c3cbd8" stroke-width="2"/>
  <path d="M56 258 L118 246 L120 254 L57 264 Z" fill="#ffffff"/>
  <!-- tail light -->
  <path d="M812 256 L852 262 L852 282 L812 276 Z" fill="#e5484d"/>
  <path d="M812 256 L848 262 L848 268 L812 262 Z" fill="#ff8f92"/>

  <!-- grille -->
  <rect x="52" y="282" width="52" height="14" rx="4" fill="#2b3240"/>
  <rect x="58" y="285" width="40" height="3" rx="1.5" fill="#6b7487"/>
  <rect x="58" y="291" width="40" height="3" rx="1.5" fill="#6b7487"/>
  <!-- front bumper line -->
  <path d="M50 296 L120 296" stroke="#9aa4b6" stroke-width="2"/>

  <!-- wheels -->
  <g>
    <circle cx="210" cy="300" r="62" fill="url(#tire)"/>
    <circle cx="210" cy="300" r="38" fill="url(#rim)"/>
    <circle cx="210" cy="300" r="30" fill="#e8ecf3"/>
    <g stroke="#8b95a6" stroke-width="5" stroke-linecap="round">
      <line x1="210" y1="272" x2="210" y2="328"/>
      <line x1="186" y1="286" x2="234" y2="314"/>
      <line x1="186" y1="314" x2="234" y2="286"/>
    </g>
    <circle cx="210" cy="300" r="10" fill="#c9d0db"/>
    <circle cx="210" cy="300" r="62" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <g>
    <circle cx="690" cy="300" r="62" fill="url(#tire)"/>
    <circle cx="690" cy="300" r="38" fill="url(#rim)"/>
    <circle cx="690" cy="300" r="30" fill="#e8ecf3"/>
    <g stroke="#8b95a6" stroke-width="5" stroke-linecap="round">
      <line x1="690" y1="272" x2="690" y2="328"/>
      <line x1="666" y1="286" x2="714" y2="314"/>
      <line x1="666" y1="314" x2="714" y2="286"/>
    </g>
    <circle cx="690" cy="300" r="10" fill="#c9d0db"/>
    <circle cx="690" cy="300" r="62" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
